<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello JS Console</title>
</head>
<body>
  <h1>Hello JS Console</h1>
  <p>Mở Console bằng phím F12 để xem kết quả và thử các câu lệnh JavaScript.</p>

  <script>
    const ten = "Nguyễn An";
    const tuoi = 20;

    console.log("Xin chào, mình tên là " + ten + ".");
    console.log("Năm nay mình " + tuoi + " tuổi.");

    const soThuNhat = 10;
    const soThuHai = 20;

    console.log("Cộng:", soThuNhat + soThuHai);
    console.log("Trừ:", soThuNhat - soThuHai);
    console.log("Nhân:", soThuNhat * soThuHai);
    console.log("Chia:", soThuNhat / soThuHai);

    console.log("'10' + 20 =", "10" + 20);
    console.log("Number('10') + 20 =", Number("10") + 20);
  </script>
</body>
</html>
